[project]
name = "distributed-rate-limiter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "sqladmin>=0.20,<1",
  "slowapi>=0.1.9,<1",
  "limits>=3.13,<6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main/app"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "locust>=2.31,<3", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src/main", "src/test"]
testpaths = ["src/test"]

[tool.ruff]
line-length = 100
target-version = "py312"

