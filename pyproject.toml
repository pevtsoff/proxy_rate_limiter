[project]
name = "distributed-rate-limiter"
version = "0.1.0"
description = "Configurable distributed proxy rate limiter in front of an arbitrary REST API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "limits>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sqladmin>=0.20",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "locust>=2.32",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src/main", "src/test"]
testpaths = ["src/test/unit", "src/test/integration"]
addopts = "--import-mode=importlib -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires PostgreSQL and Redis from docker compose"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src/main", "src/test"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# sqladmin views are configured through mutable class attributes by design.
"src/main/proxy/admin_ui/*.py" = ["RUF012"]
# Alembic autogenerated revisions keep their generated layout.
"db/migrations/versions/*.py" = ["E501"]
